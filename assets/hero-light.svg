<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" fill="none">
  <!-- Background -->
  <rect width="1200" height="340" rx="16" fill="#f6f8fa"/>

  <!-- Subtle top accent line -->
  <rect x="0" y="0" width="1200" height="3" rx="16" fill="#0969da"/>

  <!-- Terminal title bar -->
  <rect x="0" y="0" width="1200" height="44" rx="16" fill="#e1e4e8"/>
  <rect x="0" y="28" width="1200" height="16" fill="#e1e4e8"/>

  <!-- Traffic lights -->
  <circle cx="28" cy="22" r="7" fill="#ff5f56"/>
  <circle cx="52" cy="22" r="7" fill="#ffbd2e"/>
  <circle cx="76" cy="22" r="7" fill="#27c93f"/>

  <!-- Title bar text -->
  <text x="600" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#57606a">hassan@kenya: ~/engineering</text>

  <!-- Main content area -->
  <!-- Name -->
  <text x="64" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="700" fill="#1f2328">Hassan Tsuma</text>

  <!-- Role with accent -->
  <text x="64" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#0969da">Full-Stack Software Engineer</text>

  <!-- Proof line -->
  <text x="64" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#57606a">
    <tspan fill="#1a7f37" font-weight="600">$</tspan>
    <tspan fill="#57606a"> build --evidence</tspan>
  </text>

  <!-- Proof metrics as typed output -->
  <text x="64" y="234" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#1f2328">
    <tspan fill="#1a7f37">20</tspan>
    <tspan fill="#57606a"> modules · </tspan>
    <tspan fill="#1a7f37">1,600+</tspan>
    <tspan fill="#57606a"> tests · </tspan>
    <tspan fill="#1a7f37">100+</tspan>
    <tspan fill="#57606a"> migrations · </tspan>
    <tspan fill="#1a7f37">M-Pesa</tspan>
    <tspan fill="#57606a"> · </tspan>
    <tspan fill="#1a7f37">8</tspan>
    <tspan fill="#57606a"> AI providers</tspan>
  </text>

  <!-- Blinking cursor -->
  <rect x="64" y="258" width="11" height="22" rx="2" fill="#0969da">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.06s" repeatCount="indefinite"/>
  </rect>

  <!-- Prompt symbol before cursor -->
  <text x="80" y="276" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#1a7f37" font-weight="600">$</text>

  <!-- Bottom tags -->
  <text x="64" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#818b98">
    Java 21 · Spring Boot 3 · PostgreSQL · React 19 · TypeScript · Expo · Electron
  </text>

  <!-- Right side availability badge -->
  <rect x="980" y="92" width="160" height="32" rx="16" fill="#f6f8fa" stroke="#1a7f37" stroke-width="1.5"/>
  <circle cx="1000" cy="108" r="5" fill="#1a7f37">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="1014" y="113" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#1a7f37">Available immediately</text>

  <!-- Right side location -->
  <text x="1140" y="150" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#57606a">Kenya · UTC+3 · Remote (any timezone)</text>
</svg>
